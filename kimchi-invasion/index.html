<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <meta
      name="description"
      content="KIMCHI INVASION: 화성에서 김치를 재배하고 지구로 수출하는 SF 팩토리 시뮬레이션 게임"
    />
    <meta name="theme-color" content="#1a1a2e" />

    <title>KIMCHI INVASION - The Red Planet Protocol</title>

    <link rel="icon" type="image/png" href="/shared/favicon.png" />
    <link rel="stylesheet" href="/shared/styles/universal_header.css" />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./styles/tutorial.css" />
    <link rel="stylesheet" href="./styles/settings.css" />
  </head>
  <body>
    <!-- Game Loading Screen -->
    <div id="loading-screen">
      <div class="loading-content">
        <h1 class="loading-title">KIMCHI INVASION</h1>
        <p class="loading-subtitle">The Red Planet Protocol</p>
        <div class="loading-bar">
          <div class="loading-progress" id="loading-progress"></div>
        </div>
        <p class="loading-status" id="loading-status">Initializing...</p>
      </div>
    </div>

    <!-- Main Game Container -->
    <div id="app">
      <!-- Header (shared component) -->
      <header id="universal-header"></header>

      <!-- Game Canvas Area -->
      <main id="game-container">
        <canvas id="game-canvas"></canvas>

        <!-- HUD Overlay -->
        <div id="hud">
          <div id="resource-bar"></div>
          <div id="toolbar"></div>
        </div>
      </main>

      <!-- Side Panel (for menus, info) -->
      <aside id="side-panel" class="hidden"></aside>

      <!-- Modal Container -->
      <div id="modal-container" class="hidden"></div>
    </div>

    <!-- Unsupported Browser Message -->
    <noscript>
      <div class="unsupported-message">
        <p>이 게임을 플레이하려면 JavaScript가 필요합니다.</p>
        <p>브라우저 설정에서 JavaScript를 활성화해주세요.</p>
      </div>
    </noscript>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
