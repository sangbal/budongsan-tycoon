<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClickSurvivor Hub</title>
  <script type="module" crossorigin src="./assets/main-UuM-UGkI.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/modulepreload-polyfill-B5Qt9EMX.js">
  <link rel="modulepreload" crossorigin href="./assets/seoulsurvival-i18n-CiaOUQQV.js">
  <link rel="modulepreload" crossorigin href="./assets/shared-auth-DE7HrYGc.js">
  <link rel="modulepreload" crossorigin href="./assets/shared-common-Gi3XBguc.js">
  <link rel="stylesheet" crossorigin href="./assets/shared-common-CWkCve-z.css">
</head>
<body class="hub-layout" data-theme="seoulsurvival">
  <div id="header-mount"></div>
  <main id="app">
    <section class="panel hero-panel">
      <div class="hero-background"></div>
      <div class="hero-overlay"></div>
      
      <div class="hero-content">
        <div class="hero-badge">
          <span class="badge-text" data-i18n="hub.hero.badge">Capital Clicker · Seoul</span>
        </div>

        <h1 class="hero-title" data-i18n="hub.hero.title">SeoulSurvival</h1>
        <p class="hero-subtitle" data-i18n="hub.hero.subtitle">서울에서 살아남는 자본 클리커</p>

        <p class="hero-description" data-i18n="hub.hero.description" style="white-space: pre-line;">노동으로 시드를 만들고, 투자로 가속하세요.
승진과 이벤트로 다음 목표가 열립니다.</p>

        <div class="hero-features">
          <div class="feature-item">
            <span class="feature-icon">🌐</span>
            <span class="feature-text" data-i18n="hub.hero.feature1">브라우저에서 즉시 플레이</span>
          </div>
          <div class="feature-item">
            <span class="feature-icon">☁️</span>
            <span class="feature-text" data-i18n="hub.hero.feature2">클라우드 저장 & 리더보드</span>
          </div>
          <div class="feature-item">
            <span class="feature-icon">🚀</span>
            <span class="feature-text" data-i18n="hub.hero.feature3">설치/가입 없음</span>
          </div>
        </div>

        <div class="hero-cta">
          <a
            class="btn btn-primary btn-hero"
            href="./seoulsurvival/"
            role="button"
            aria-label="SeoulSurvival 게임 시작하기 - 서울에서 살아남는 자본 클리커 게임"
          >
            <span class="btn-icon">▶</span>
            <span class="btn-text" data-i18n="hub.hero.cta.play">SeoulSurvival Play</span>
          </a>
        </div>
      </div>
    </section>

    <!-- Game List Section (현재 비활성화 - 게임 개발 완료 후 활성화 예정) -->

        <!- 동적 렌더링: hub/main.js에서 renderGameCards() 호출 ->
      </div>
    </section>
    -->
  </main>
  <div id="footer-mount"></div>
</body>
</html>
