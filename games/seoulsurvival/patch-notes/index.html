  <link rel="apple-touch-icon" href="../../../seoulsurvival/assets/images/logo.webp" />

  <link rel="stylesheet" href="/shared/styles/uniform-core.css" />
  <link rel="stylesheet" href="/shared/styles/header.css" />
  <link rel="stylesheet" href="/shared/styles/footer.css" />

  <style>
    :root {
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 20px;
      --space-6: 24px;
      --space-7: 32px;
      --space-8: 48px;
      --space-9: 64px;
      --font-xs: 12px;
      --font-sm: 13px;
      --font-md: 14px;
      --font-lg: 16px;
      --font-xl: 18px;
      --font-2xl: clamp(28px, 3.4vw, 44px);
    }

    body {
      overflow-x: hidden;
      line-height: 1.5;
    }

    .wrap {
      max-width: 1080px;
      margin: 0 auto;
      padding: 0 18px 70px;
    }

    .page-header {
      margin-top: var(--space-8);
      margin-bottom: var(--space-6);
    }

    .page-title {
      font-size: clamp(24px, 3.4vw, 44px);
      font-weight: 950;
      margin: 0 0 var(--space-3);
      letter-spacing: -.3px;
      line-height: 1.2;
    }

    .page-subtitle {
      color: var(--muted);
      font-size: var(--font-md);
      margin: 0;
    }

    .release-note {
      border: 1px solid var(--border);
      background: var(--surface);
      border-radius: var(--radius);
      padding: var(--space-6);
      margin-bottom: var(--space-5);
    }

    .release-note-header {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: var(--space-3);
      margin-bottom: var(--space-4);
    }

    .release-note-version {
      font-size: var(--font-xl);
      font-weight: 950;
      color: var(--accent);
    }

    .release-note-title {
      font-size: var(--font-lg);
      font-weight: 700;
      color: var(--text);
      margin: 0;
    }

    .release-note-date {
      color: var(--muted);
      font-size: var(--font-sm);
      margin-left: auto;
    }

    .release-note-content {
      color: var(--text);
      font-size: var(--font-md);
      line-height: 1.7;
    }

    .patch-item {
      margin: var(--space-2) 0;
      padding-left: var(--space-4);
      position: relative;
    }

    .patch-item::before {
      content: '';
      position: absolute;
      left: 0;
      top: 8px;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
    }

    .patch-category {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: var(--font-xs);
      font-weight: 700;
      margin-right: var(--space-2);
      text-transform: uppercase;
    }

    .category-feature {
      background: rgba(34, 197, 94, 0.15);
      color: #22c55e;
    }

    .category-fix {
      background: rgba(239, 68, 68, 0.15);
      color: #ef4444;
    }

    .category-balance {
      background: rgba(168, 85, 247, 0.15);
      color: #a855f7;
    }

    .category-ui {
      background: rgba(96, 165, 250, 0.15);
      color: #60a5fa;
    }

    .category-content {
      background: rgba(251, 191, 36, 0.15);
      color: #fbbf24;
    }

    .category-performance {
      background: rgba(251, 146, 60, 0.2);
      color: #fb923c;
      border: 1px solid #fb923c;
    }

    .empty-state {
      text-align: center;
      padding: var(--space-9) var(--space-4);
      color: var(--muted);
    }

    @media (max-width: 600px) {
      .release-note-header {
        grid-template-columns: 1fr;
        gap: var(--space-2);
      }

      .release-note-date {
        grid-column: 1;
        justify-self: start;
      }
    }
  </style>
</head>
<body>
  <!-- Header mount point -->
  <div id="header-mount"></div>

  <main class="wrap" data-testid="patch-notes-root">
    <div class="page-header">
      <h1 class="page-title" data-i18n="patchNotes.pageTitle">Seoul Survival 패치노트</h1>
      <p class="page-subtitle" data-i18n="patchNotes.pageSubtitle">최신 업데이트와 변경사항</p>
    </div>

    <div id="patchnotes-container">
      <!-- Patch notes will be dynamically rendered -->
    </div>
  </main>

  <!-- Footer mount point -->
  <div id="footer-mount"></div>

  <script type="module" src="./main.js"></script>
</body>
</html>
